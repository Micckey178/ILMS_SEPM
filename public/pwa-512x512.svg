<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Circuit & Grid Lines subtle background -->
  <path d="M64 256h80m184 0h120M256 64v80m0 184v120" stroke="#0284c7" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <!-- Laboratory Flask & Atom Fusion Icon -->
