    <!-- Flask neck -->
    <rect x="88" y="20" width="44" height="60" rx="6" fill="#bae6fd" fill-opacity="0.3" stroke="#38bdf8" stroke-width="8" />
    <path d="M80 20h60" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <!-- Flask Body -->
    <path d="M88 80 L30 200 C15 230 40 260 75 260 L145 260 C180 260 205 230 190 200 L132 80 Z" fill="url(#flaskGrad)" stroke="#7dd3fc" stroke-width="8" stroke-linejoin="round" />
    <!-- Liquid Surface Wave -->
    <path d="M45 210 Q75 190 110 210 T175 210" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <!-- Rising Bubbles -->
    <circle cx="85" cy="180" r="10" fill="#ffffff" opacity="0.75" />
    <circle cx="125" cy="150" r="7" fill="#ffffff" opacity="0.65" />
    <circle cx="105" cy="220" r="12" fill="#ffffff" opacity="0.8" />
  </g>
  <!-- Text Badge ILMS -->
  <rect x="156" y="405" width="200" height="48" rx="24" fill="#0284c7" />
  <text x="256" y="438" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="4" text-anchor="middle">ILMS LABS</text>
